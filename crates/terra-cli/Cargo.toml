[package]
name = "terra-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
terra-agents = { path = "../terra-agents" }
terra-types = { path = "../terra-types" }
terra-core = { path = "../terra-core" }
terra-executor = { path = "../terra-executor" }
terra-memory = { path = "../terra-memory" }
terra-caging = { path = "../terra-caging" }
terra-trace = { path = "../terra-trace" }
terra-providers = { path = "../terra-providers" }
terra-mcp = { path = "../terra-mcp" }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
rustyline.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
terra-types = { path = "../terra-types" }
terra-protocol = { path = "../terra-protocol" }
terra-providers = { path = "../terra-providers" }
