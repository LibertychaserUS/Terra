[workspace]
resolver = "2"
members = [
    "crates/terra-types",
    "crates/terra-memory",
    "crates/terra-providers",
    "crates/terra-caging",
    "crates/terra-trace",
    "crates/terra-executor",
    "crates/terra-mcp",
    "crates/terra-agents",
    "crates/terra-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
description = "Terra — a caged agent runtime"
repository = "https://github.com/LibertychaserUS/terra"
homepage = "https://github.com/LibertychaserUS/terra"
keywords = ["ai", "agent", "cli", "coding", "llm"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
rustyline = "15"
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "rustls"] }
rmcp = { version = "3.8", default-features = false }
sha2 = "0.10"

[profile.release]
# Drop symbols from the shipped binary.
strip = true
